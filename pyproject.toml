[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-arranger"
description = "Grid Arranger for LightBurn — moves existing groups in .lbrn2 projects into an exact grid (unofficial tool)."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Jádro (domain, core), adaptér a úloha používají jen standardní knihovnu; PySide6 jen GUI.
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Sestavení GridArranger.exe (tools/build_exe.py); Pillow jen pro tools/make_icon.py
build = ["pyinstaller>=6.10,<7"]

[project.gui-scripts]
GridArranger = "grid_arranger.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "grid_arranger.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grid_arranger = ["gui/help/*/*.md", "gui/translations/*.qm", "gui/resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
